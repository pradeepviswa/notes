<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Equipment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 16px;
            text-align: center;
            width: 250px;
        }

        .card img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }

        .card h3 {
            margin-top: 12px;
            color: #333;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Item 1 -->
        <div class="card">
            <img src="https://pvstorage111.blob.core.windows.net/con1/Screenshot 2026-03-01 222000.png" alt="Cricket Bat">
            <h3>Cricket Bat</h3>
        </div>

        <!-- Item 2 -->
        <div class="card">
            <img src="https://pvstorage111.blob.core.windows.net/con1/Screenshot 2026-03-02 145022.png" alt="Football">
            <h3>Football</h3>
        </div>
    </div>

</body>
</html>
