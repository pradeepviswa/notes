apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: local-app
        image: myapp:v1
        ports:
        - containerPort: 3000

